services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://portafolio:${POSTGRES_PASSWORD}@db:5432/portafolio
      REDIS_URL: redis://redis:6379/0
      MCP_CALENDAR: http://mcp-calendar:8001/mcp-server/mcp
      MCP_NOTION: http://mcp-notion:8002/mcp-server/mcp
      MCP_GITHUB: http://mcp-github:8004/mcp-server/mcp
      # Archivos y vault: el MCP corre en home-lab-laptop y se llega por Tailscale (backend/servers/mcp_servers/files)
      MCP_ARCHIVOS: http://100.68.212.44:8005/mcp-server/mcp
    # Solo escucha en la máquina: la entrada desde internet es el túnel de Cloudflare.
    ports:
      - "127.0.0.1:8096:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portafolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portafolio
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portafolio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mcp-calendar:
    build: ./backend/servers/mcp_servers/calendar
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}

  mcp-notion:
    build: ./backend/servers/mcp_servers/notion
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}

  mcp-github:
    build: ./backend/servers/mcp_servers/github
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}

  # Túnel propio de Cloudflare (brokeria-portafolio): publica api-portafolio.brokeria.ec → http://backend:8000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend

volumes:
  pg_data:
